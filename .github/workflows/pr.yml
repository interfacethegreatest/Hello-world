name: Validate pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Tests, typecheck, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
